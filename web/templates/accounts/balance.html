{{ define "content" }}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-2">Set Balance</h1>
    <p class="text-base-content/60 mb-6">{{ .Name }}</p>
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <form method="POST" action="/accounts/{{ .ID }}/balance">
                <div class="form-control mb-6">
                    <label class="label"><span class="label-text">Balance ({{ .Currency }})</span></label>
                    <label class="input input-bordered flex items-center gap-1">
                        <span class="text-base-content/50">$</span>
                        <input type="number" name="balance" value="{{ .CurrentBalance }}"
                            class="grow" step="0.01" min="0" placeholder="0.00" autofocus />
                    </label>
                    <label class="label">
                        <span class="label-text-alt text-base-content/50">Leave empty to use transaction sum instead</span>
                    </label>
                </div>
                <div class="flex gap-2 justify-end">
                    <a href="/" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
